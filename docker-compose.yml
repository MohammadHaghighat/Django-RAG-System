services:
  web:
    build: .
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface # ذخیره کش مدل‌های هوش مصنوعی
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # این خط اجازه میده داکر به فیلترشکن سیستم شما وصل بشه
    restart: always

volumes:
  hf_cache: